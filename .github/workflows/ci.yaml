name: Continuous Integration
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
      - name: Cache node modules
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ./node_modules
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: node_modules-
      - name: Install
        run: npm ci
      - name: Lint check
        run: npm run fmt-check
      - name: Build Typescript Files
        run: npm run build
      - name: Verify TypeScript files Built
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "you need to run 'npm run build' and commit the changes"
            echo "$status"
            git --no-pager diff
            exit 1
          fi
  integration-tests:
    strategy:
      matrix:
        dialect: [ mysql, postgres, sqlite, mssql ]
        language: [ ts, js ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
      - name: Cache node modules
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ./node_modules
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: node_modules-
      - name: Install
        run: npm ci --ignore-scripts=false
      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0
      - name: Run and verify load output
        working-directory: ./testdata/${{ matrix.language }}
        run: |
          if [ "${{ matrix.language }}" = "ts" ]; then
            npx ts-node load-entities.ts ${{ matrix.dialect }} > actual-schema.sql
          else
            node load-entities.js ${{ matrix.dialect }} > actual-schema.sql
          fi
          diff -u -b output/${{ matrix.dialect }}/schema.sql actual-schema.sql || (
            echo "Schema output does not match expected file." && exit 1
          )
      - name: Cleanup temp file
        working-directory: ./testdata/${{ matrix.language }}
        run: rm -f actual-schema.sql
      - name: Run Test as Standalone
        working-directory: ./testdata/${{ matrix.language }}
        run: |
          atlas migrate diff --env typeorm -c "file://atlas-standalone.hcl" --var dialect=${{ matrix.dialect }}
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
      - name: Verify migrations generated
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "you need to run 'atlas migrate diff --env typeorm' and commit the changes"
            echo "$status"
            git --no-pager diff
            exit 1
           fi
      - name: Run Test as ${{ matrix.language }} Script
        working-directory: ./testdata/${{ matrix.language }}
        run: |
          atlas migrate diff --env typeorm -c "file://atlas-script.hcl" --var dialect=${{ matrix.dialect }}
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
      - name: Verify migrations generated
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "you need to run 'atlas migrate diff --env typeorm' and commit the changes"
            echo "$status"
            git --no-pager diff
            exit 1
           fi
